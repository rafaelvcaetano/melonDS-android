name: melonDS Android Nightly Build

on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.repository != 'rafaelvcaetano/melonDS-android' }}

jobs:
  # Only trusted upstream master builds may sign and publish a nightly release.
  build:
    if: github.repository == 'rafaelvcaetano/melonDS-android' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Verify immutable CI dependencies
        run: python3 .github/check_ci_integrity.py

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Keep SDK provisioning independent of action defaults.
          packages: platform-tools

      - name: Build melonDS Android
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2 ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          echo "$MELONDS_KEYSTORE" | base64 -d > "${{ runner.temp }}/keystore.jks"
          echo "MELONDS_KEYSTORE=${{ runner.temp }}/keystore.jks" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          sh ./gradlew :app:assembleGitHubNightlyRelease
          git tag -m "Nightly Release" -f -a nightly-release
          git push -f origin refs/tags/nightly-release

      - name: Update GitHub Nightly Release
        id: update_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          allowUpdates: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly-release
          name: 'Nightly Build'
          body: 'The currently Nightly Build. Whenever new changes are pushed, you can find the latest build here. You can keep this installation alongside your main one.'
          artifacts: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk
          artifactContentType: application/vnd.android.package-archive

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: melonDS-android
          path: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk

  verify:
    name: Unit tests, lint and ARM64 debug APK
    if: github.repository != 'rafaelvcaetano/melonDS-android' || github.ref != 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify immutable CI dependencies
        run: python3 .github/check_ci_integrity.py

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Test, lint and build ARM64 debug APK
        run: >-
          sh ./gradlew :app:testGitHubNightlyDebugUnitTest
          :app:assembleGitHubNightlyDebug
          :app:lintGitHubNightlyDebug
          --no-daemon --max-workers=2
          -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: melonDS-unit-test-results
          path: app/build/test-results/testGitHubNightlyDebugUnitTest/*.xml
          retention-days: 7
          if-no-files-found: warn

      # Debug signing and the .dev application ID keep this separate from releases.
      - name: Upload debug test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: melonDS-android-debug-test-build-arm64
          path: app/build/intermediates/apk/gitHubNightly/debug/app-gitHub-nightly-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: melonDS-lint-results
          path: app/build/reports/lint-results-gitHubNightlyDebug.*
          retention-days: 7
          if-no-files-found: warn

  native-tests:
    name: Native sanitizer tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      CC: clang
      CXX: clang++
      CMAKE_BIN: cmake
      CMAKE: cmake
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      REQUIRE_CORE_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify immutable CI dependencies
        run: python3 .github/check_ci_integrity.py
      - name: Build instrumented core
        run: bash tools/core-host-sanitize.sh
      - name: Test native policies, saves and JIT invalidation
        run: bash tools/host-tests.sh
      - name: Test security boundary regressions
        run: bash tools/host-tests/security/run.sh
      - name: Test DNS packets
        run: bash tools/host-tests/dns/run.sh
      - name: Test NAND JNI reference lifetime
        run: bash tools/host-tests/nand-jni/run.sh
